<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lift Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0c0e10;
    --surface:#15181c;
    --surface2:#1d2126;
    --line:#2a2f36;
    --text:#eef1f3;
    --muted:#8b939c;
    --ghost:#5c646d;
    --accent:#0bda6e;
    --accent-dim:#0a5c33;
    --danger:#e05555;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;
    padding-bottom:76px;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3{font-weight:800;letter-spacing:.01em}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  input[type=number]{-moz-appearance:textfield;text-align:center;font-variant-numeric:tabular-nums}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}

  .top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);
    padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
  .top h1{font-size:22px;text-transform:uppercase;letter-spacing:.12em}
  .top h1 b{color:var(--accent)}
  .top .date{color:var(--muted);font-size:13px}

  .wrap{padding:0 14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}

  .btn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font-weight:700;text-align:center;display:inline-block}
  .btn.primary{background:var(--accent);color:#04140b;border-color:var(--accent)}
  .btn.subtle{color:var(--muted)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.block{display:block;width:100%}
  .btn:active{transform:scale(.98)}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;
    background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:12px 0 10px;color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:3px;align-items:center}
  nav button.on{color:var(--accent)}
  nav button .ic{font-size:20px;line-height:1}

  /* day cards */
  .daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
  .daycard:active{border-color:var(--accent)}
  .daycard .nm{font-weight:800;font-size:17px}
  .daycard .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .daycard .go{color:var(--accent);font-size:20px;font-weight:800}
  .proglabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;
    font-weight:700;margin:2px 2px 8px}

  /* workout logging */
  .ex-block{margin-bottom:14px}
  .ex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .ex-head h3{font-size:17px}
  .ex-head .grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .target-chip{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent-dim);
    border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .beat{font-size:12px;color:var(--ghost);margin-bottom:8px;font-variant-numeric:tabular-nums}
  .beat b{color:var(--muted)}
  .setline{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:8px}
  .setline .n{color:var(--muted);font-weight:700;text-align:center;font-size:14px}
  .setline .done{color:var(--accent)}
  .stepwrap{display:flex;align-items:stretch;gap:0;background:var(--surface2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepwrap input{border:none;border-radius:0;background:transparent;padding:10px 0;min-width:0;flex:1}
  .stepwrap button{width:30px;font-size:17px;font-weight:800;color:var(--muted);flex:none}
  .stepwrap button:active{color:var(--accent)}
  .chk{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ghost)}
  .chk.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  .collabel{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:6px;
    font-size:11px;color:var(--ghost);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .collabel span:nth-child(2),.collabel span:nth-child(3){text-align:center}
  .addset{color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
  .rmset{color:var(--ghost);font-weight:700;font-size:14px;padding:6px 0 6px 14px}

  /* rest timer */
  .timerbar{position:fixed;bottom:64px;left:12px;right:12px;z-index:9;
    background:var(--surface2);border:1px solid var(--accent);border-radius:12px;
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .timerbar .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}

  /* library */
  .lib-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .lib-item:last-child{border-bottom:none}
  .lib-item .nm{font-weight:700}
  .lib-item .sub{font-size:12px;color:var(--muted)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .tag.green{border-color:var(--accent);color:var(--accent)}
  .archived .nm,.archived .sub{color:var(--ghost);text-decoration:line-through}
  .picklist .lib-item{cursor:pointer;border:1px solid var(--line);border-radius:12px;
    margin-bottom:8px;padding:12px;background:var(--surface2)}
  .picklist .lib-item:last-child{border-bottom:1px solid var(--line)}
  .picklist .lib-item:active{border-color:var(--accent);background:var(--accent-dim)}
  .picklist .tag{border-color:var(--accent);color:var(--accent)}

  /* program editor */
  .prog-day{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .prog-day:last-child{border-bottom:none}
  .itemline{display:block;padding:9px 0;border-bottom:1px solid var(--line)}
  .itemline:last-child{border-bottom:none}
  .itemline .nm{font-weight:700;font-size:14px;margin-bottom:6px}
  .itemline .ctrls{display:flex;align-items:center;gap:8px}
  .itemline .ctrls .sp{flex:1}
  .mini{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:15px}
  .mini:active{color:var(--accent);border-color:var(--accent)}
  .mini.del{color:var(--danger)}
  .setsnum{font-weight:800;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .targetinp{width:64px;flex:none;padding:7px 6px;font-size:13px;text-align:center}

  /* history / charts */
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;
    font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2)}
  .seg button.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
  .spark{width:100%;height:120px;display:block}
  .sess{border-bottom:1px solid var(--line);padding:10px 0}
  .sess:last-child{border-bottom:none}
  .sess .d{font-weight:800;font-size:14px}
  .sess .ln{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}

  /* weight tab */
  .wt-big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .wt-delta{font-size:14px;font-weight:700}
  .wt-delta.up{color:var(--danger)}
  .wt-delta.down{color:var(--accent)}
  .wt-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .wt-row:last-child{border-bottom:none}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;
    align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:85vh;max-height:85dvh;overflow-y:auto}
  .sheet h2{font-size:18px;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}

  .banner{background:#3a2a12;border:1px solid #8a6520;color:#e8c87a;border-radius:12px;
    padding:10px 12px;font-size:13px;margin:0 14px 12px}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <h1>Lift<b>Log</b></h1>
  <div class="date" id="topDate"></div>
</div>
<div id="storageBanner" class="banner" style="display:none">
  Heads up: storage isn't available in this viewer, so nothing will save. Use the installed app or Chrome at your GitHub Pages URL — then everything persists.
</div>

<div class="wrap" id="view"></div>

<div class="timerbar" id="timerbar" style="display:none">
  <div class="t" id="timerT">1:30</div>
  <div class="grow muted small">Rest</div>
  <button class="btn subtle" onclick="Timer.add(30)">+30s</button>
  <button class="btn subtle" onclick="Timer.stop()">✕</button>
</div>

<nav>
  <button id="nav-workout" onclick="go('workout')"><span class="ic">▲</span>Workout</button>
  <button id="nav-library" onclick="go('library')"><span class="ic">≡</span>Library</button>
  <button id="nav-history" onclick="go('history')"><span class="ic">◔</span>Progress</button>
  <button id="nav-weight" onclick="go('weight')"><span class="ic">◇</span>Weight</button>
</nav>

<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- storage ---------- */
const KEY="liftlog.v1";
let storageOK=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}
catch(e){storageOK=false;document.getElementById("storageBanner").style.display="block";}
let memStore=null;

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}

function defaultState(){
  return {exercises:[],sessions:[],active:null,settings:{restSec:90,step:5},weights:[],programs:null,activeProgram:null};
}

/* schema migration: v1 (no programs/weights) -> v2 */
function migrate(s){
  if(!s.settings)s.settings={restSec:90,step:5};
  if(!Array.isArray(s.weights))s.weights=[];
  if(!Array.isArray(s.exercises))s.exercises=[];
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.programs)){
    const findOrCreate=(name,group)=>{
      let ex=s.exercises.find(e=>e.name.trim().toLowerCase()===name.trim().toLowerCase());
      if(!ex){ex={id:uid(),name,group,archived:false};s.exercises.push(ex);}
      return ex.id;
    };
    const D=(name,items)=>({id:uid(),name,
      items:items.map(it=>({exId:findOrCreate(it[0],it[1]),sets:it[2],target:it[3]||""}))});
    const prog={id:uid(),name:"Operation Halloween",days:[
      D("Push",[
        ["DB Incline Press","Push",4,"8-10"],
        ["DB Flat Press","Push",3,"10-12"],
        ["Cable Chest Fly","Push",3,"12-15"],
        ["Cable Lateral Raise","Push",4,"15"],
        ["Seated DB Shoulder Press","Push",3,"10"],
        ["Cable Tricep Pushdown","Push",3,"12-15"],
        ["DB Overhead Tricep Ext","Push",3,"12"]]),
      D("Pull",[
        ["Cable Lat Pull Down","Pull",4,"8-10"],
        ["Machine Seated Row","Pull",3,"12"],
        ["Cable Straight Arm Pulldown","Pull",3,"15"],
        ["DB Single Arm Row","Pull",3,"12 ea"],
        ["External Shoulder Rotation","Pull",3,"15-20"],
        ["DB Hammer Curl","Pull",3,"12"],
        ["Cable Curl","Pull",3,"15"]]),
      D("Legs",[
        ["Bag Squat","Legs",4,"8-10"],
        ["Cable Pull Thru","Legs",4,"10"],
        ["DB Bulgarian Split Squat","Legs",3,"10 ea"],
        ["DB Hip Thrust","Legs",3,"15"],
        ["Walking Lunges W/Bag","Legs",3,"15"],
        ["Standing DB Calf Raise","Legs",4,"20"],
        ["Farmer's Walk","Legs",3,""]]),
      D("Push (variation)",[
        ["Smith Machine Incline Press","Push",4,"8-10"],
        ["Smith Machine Flat Press","Push",3,"10-12"],
        ["Cable Chest Fly","Push",3,"12-15"],
        ["Cable Lateral Raise","Push",4,"15"],
        ["Seated Arnold Shoulder Press","Push",3,"10"],
        ["Cable Tricep Pushdown","Push",3,"12-15"],
        ["DB Overhead Tricep Ext","Push",3,"12"]]),
      D("Full Body / Power",[
        ["Heavy KB Deadlift (sumo)","Legs",4,"6-8"],
        ["Cable Lat Pulldown (wide)","Pull",4,"10-12"],
        ["DB Incline Curl","Pull",3,"12"],
        ["KB Goblet Squat","Legs",3,"15"],
        ["KB Single Leg RDL","Legs",3,"10 ea"],
        ["Cable Woodchop","Other",3,"15 ea"],
        ["Dead Bug","Other",3,"45s"]])
    ]};
    s.programs=[prog];
    s.activeProgram=prog.id;
  }
  if(s.activeProgram&&!s.programs.find(p=>p.id===s.activeProgram))
    s.activeProgram=s.programs.length?s.programs[0].id:null;
  return s;
}

function load(){
  if(!storageOK)return memStore||(memStore=migrate(defaultState()));
  try{const raw=localStorage.getItem(KEY);return migrate(raw?JSON.parse(raw):defaultState());}
  catch(e){return migrate(defaultState());}
}
function save(){
  if(!storageOK){memStore=S;return;}
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
let S=load();
save();

/* ---------- helpers ---------- */
const $=(sel,el=document)=>el.querySelector(sel);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDate=iso=>{const[y,m,d]=iso.split("-");return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});};
const exById=id=>S.exercises.find(e=>e.id===id);
const progById=id=>S.programs.find(p=>p.id===id);
const activeProg=()=>S.activeProgram?progById(S.activeProgram):null;
const e1rm=(w,r)=>r>0?w*(1+r/30):0;

function lastEntryFor(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const en=S.sessions[i].entries.find(e=>e.exId===exId&&e.sets.some(s=>s.done&&s.r>0));
    if(en)return {date:S.sessions[i].date,sets:en.sets.filter(s=>s.done&&s.r>0)};
  }
  return null;
}
function bestE1rmFor(exId){
  let best=0;
  for(const sess of S.sessions){
    const en=sess.entries.find(e=>e.exId===exId);
    if(!en)continue;
    for(const s of en.sets)if(s.done)best=Math.max(best,e1rm(s.w,s.r));
  }
  return best;
}
function sessionCountFor(exId){
  return S.sessions.filter(s=>s.entries.some(e=>e.exId===exId)).length;
}
function sortSessions(){S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}

/* ---------- rest timer ---------- */
const Timer={
  end:0,iv:null,
  start(sec){this.end=Date.now()+sec*1000;this.show();this.tick();
    clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),250);},
  add(sec){this.end+=sec*1000;this.tick();},
  stop(){clearInterval(this.iv);document.getElementById("timerbar").style.display="none";},
  show(){document.getElementById("timerbar").style.display="flex";},
  tick(){
    const ms=this.end-Date.now();
    if(ms<=0){this.stop();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}return;}
    const s=Math.ceil(ms/1000);
    document.getElementById("timerT").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
};

/* ---------- navigation ---------- */
let tab="workout";
function go(t){tab=t;render();}
function render(){
  document.getElementById("topDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  for(const t of["workout","library","history","weight"])
    document.getElementById("nav-"+t).classList.toggle("on",t===tab);
  const v=document.getElementById("view");
  if(tab==="workout")v.innerHTML=Workout.html();
  else if(tab==="library")v.innerHTML=Library.html();
  else if(tab==="history")v.innerHTML=History.html();
  else v.innerHTML=Weight.html();
  if(tab==="history")History.drawChart();
  if(tab==="weight")Weight.drawChart();
}

/* ---------- workout tab ---------- */
const Workout={
  html(){
    if(!S.active){
      const p=activeProg();
      const last=S.sessions[S.sessions.length-1];
      let out="";
      if(p&&p.days.length){
        out+=`<div class="proglabel">${esc(p.name)}</div>`;
        for(const d of p.days){
          let lastDone=null;
          for(let i=S.sessions.length-1;i>=0;i--)
            if(S.sessions[i].dayId===d.id){lastDone=S.sessions[i].date;break;}
          out+=`<button class="daycard" onclick="Workout.startDay('${d.id}')">
            <div class="grow"><div class="nm">${esc(d.name)}</div>
            <div class="sub">${d.items.length} exercise${d.items.length===1?"":"s"}${lastDone?" · Last: "+fmtDate(lastDone):""}</div></div>
            <div class="go">›</div></button>`;
        }
        out+=`<div style="height:6px"></div>`;
      }
      out+=`<div class="card">
        ${p?"":`<p class="muted small" style="margin-bottom:12px">No active program — set one up in the Library tab, or lift freestyle:</p>`}
        <button class="btn ${p?"":"primary"} block" onclick="Workout.startNew()">Start empty workout</button>
        ${last?`<button class="btn block" style="margin-top:8px" onclick="Workout.repeatLast()">Repeat last workout</button>`:""}
      </div>`;
      return out;
    }
    const a=S.active;
    const isPast=a.date!==todayStr();
    const day=a.dayId&&activeProg()?activeProg().days.find(d=>d.id===a.dayId):null;
    let out=`<div class="card"><div class="row">
      <div class="grow"><b>${isPast?"Logging past workout":day?esc(day.name):"Session in progress"}</b>
        <div class="muted small">${fmtDate(a.date)} · ${a.entries.length} exercise${a.entries.length===1?"":"s"}
        <button style="color:var(--accent);font-weight:700;padding:2px 6px" onclick="Workout.editDate()">edit date</button></div></div>
    </div></div>`;
    for(const en of a.entries)out+=this.entryHtml(en);
    out+=`<button class="btn block" onclick="Workout.pickExercise()">+ Add exercise</button>
      <div class="card" style="margin-top:12px">
        <div class="field" style="margin-bottom:0"><label>Session notes</label>
          <textarea id="sessNotes" rows="3" placeholder="Anything worth remembering — shoulder felt off, split a set, low energy…"
            onchange="Workout.setNotes(this.value)">${esc(a.notes||"")}</textarea></div>
      </div>
      <div style="height:22px"></div>
      <button class="btn primary block" onclick="Workout.finish()">${isPast?"Save workout":"Finish workout"}</button>
      <button class="btn block subtle" style="margin-top:10px" onclick="Workout.discard()">Discard session</button>
      <div style="height:90px"></div>`;
    return out;
  },
  entryHtml(en){
    const ex=exById(en.exId);
    const prev=lastEntryFor(en.exId);
    const prevTxt=prev?prev.sets.map(s=>`${s.w}×${s.r}`).join("  ·  "):null;
    let rows="";
    en.sets.forEach((s,i)=>{
      const ph=prev&&prev.sets[i]?prev.sets[i]:null;
      rows+=`<div class="setline">
        <div class="n ${s.done?"done":""}">${i+1}</div>
        <div class="stepwrap">
          <button onclick="Workout.bump('${en.exId}',${i},'w',-1)">−</button>
          <input type="number" inputmode="decimal" value="${s.w||""}" placeholder="${ph?ph.w:"lb"}"
            onchange="Workout.setVal('${en.exId}',${i},'w',this.value)">
          <button onclick="Workout.bump('${en.exId}',${i},'w',1)">+</button>
        </div>
        <div class="stepwrap">
          <button onclick="Workout.bump('${en.exId}',${i},'r',-1)">−</button>
          <input type="number" inputmode="numeric" value="${s.r||""}" placeholder="${ph?ph.r:"reps"}"
            onchange="Workout.setVal('${en.exId}',${i},'r',this.value)">
          <button onclick="Workout.bump('${en.exId}',${i},'r',1)">+</button>
        </div>
        <button class="chk ${s.done?"on":""}" onclick="Workout.toggleDone('${en.exId}',${i})">✓</button>
      </div>`;
    });
    return `<div class="card ex-block">
      <div class="ex-head"><h3>${esc(ex?ex.name:"?")}${en.target?`<span class="target-chip">${esc(en.sets.length)}×${esc(en.target)}</span>`:""}</h3>
      <span class="grp">${esc(ex?ex.group:"")}</span></div>
      ${prevTxt?`<div class="beat">Beat last (${fmtDate(prev.date)}): <b>${prevTxt}</b></div>`:`<div class="beat">First time — set the bar.</div>`}
      <div class="collabel"><span></span><span>Weight</span><span>Reps</span><span></span></div>
      ${rows}
      <div class="row">
        <button class="addset" onclick="Workout.addSet('${en.exId}')">+ Add set</button>
        <div class="grow"></div>
        ${en.sets.length>1?`<button class="rmset" onclick="Workout.removeSet('${en.exId}')">− Remove set</button>`:""}
        <button class="rmset" onclick="Workout.removeEntry('${en.exId}')">Remove exercise</button>
      </div>
    </div>`;
  },
  startNew(date){S.active={id:uid(),date:date||todayStr(),dayId:null,notes:"",entries:[]};save();render();this.pickExercise();},
  /* set-for-set pre-fill: set i today gets weight AND reps from set i last session.
     Extra sets beyond last session's count cascade from the previous set in this session.
     First-ever log of an exercise: no pre-fill (ghost placeholders remain). */
  prefillSets(exId,count){
    const prev=lastEntryFor(exId);
    const sets=[];
    for(let i=0;i<count;i++){
      let w=0,r=0;
      if(prev){
        if(prev.sets[i]){w=prev.sets[i].w;r=prev.sets[i].r;}
        else if(sets.length){w=sets[sets.length-1].w;r=sets[sets.length-1].r;}
        else{w=prev.sets[prev.sets.length-1].w;r=prev.sets[prev.sets.length-1].r;}
      }
      sets.push({w,r,done:false});
    }
    return sets;
  },
  startDay(dayId,date){
    const p=activeProg();
    const day=p.days.find(d=>d.id===dayId);
    if(!day)return;
    S.active={id:uid(),date:date||todayStr(),dayId,notes:"",entries:day.items.map(it=>({
      exId:it.exId,target:it.target||"",
      sets:this.prefillSets(it.exId,Math.max(1,it.sets))
    }))};
    save();render();
  },
  editDate(){
    Modal.open(`<h2>Session date</h2>
      <div class="field"><label>Date this workout happened</label>
        <input type="date" id="sessDate" value="${S.active.date}" max="${todayStr()}"></div>
      <button class="btn primary block" onclick="Workout.setDate()">Save date</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="Modal.close()">Cancel</button>`);
  },
  setDate(){
    const v=$("#sessDate").value;
    if(v){S.active.date=v;save();}
    Modal.close();render();
  },
  repeatLast(){
    const last=S.sessions[S.sessions.length-1];
    S.active={id:uid(),date:todayStr(),dayId:last.dayId||null,notes:"",entries:last.entries.map(en=>({
      exId:en.exId,target:en.target||"",
      sets:en.sets.filter(s=>s.done).map(s=>({w:s.w,r:s.r,done:false}))
    })).filter(en=>en.sets.length)};
    save();render();
  },
  pickExercise(){
    const groups=["Push","Pull","Legs","Other"];
    const avail=S.exercises.filter(e=>!e.archived&&!S.active.entries.some(en=>en.exId===e.id));
    let list="";
    for(const g of groups){
      const ex=avail.filter(e=>e.group===g);
      if(!ex.length)continue;
      list+=`<div class="muted small" style="margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">${g}</div>`;
      for(const e of ex){
        const prev=lastEntryFor(e.id);
        list+=`<div class="lib-item" onclick="Workout.addEntry('${e.id}')">
          <div class="grow"><div class="nm">${esc(e.name)}</div>
          <div class="sub">${prev?"Last: "+prev.sets.map(s=>s.w+"×"+s.r).join(", "):"Never logged"}</div></div>
          <span class="tag">Add</span></div>`;
      }
    }
    Modal.open(`<h2>Add to this workout</h2>
      <p class="muted small" style="margin:-8px 0 10px">Tap an exercise to add it to your session.</p>
      <div class="picklist">${list||'<div class="empty">Everything in your library is already in this session.</div>'}</div>
      <button class="btn block" style="margin-top:12px" onclick="Modal.close();Library.edit(null,true)">Create new exercise & add to workout</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="Modal.close()">Cancel</button>`);
  },
  addEntry(exId){
    const prev=lastEntryFor(exId);
    const n=prev?prev.sets.length:3;
    S.active.entries.push({exId,target:"",sets:this.prefillSets(exId,n)});
    save();Modal.close();render();
  },
  removeEntry(exId){
    if(!confirm("Remove this exercise from the session?"))return;
    S.active.entries=S.active.entries.filter(e=>e.exId!==exId);save();render();
  },
  addSet(exId){
    const en=S.active.entries.find(e=>e.exId===exId);
    const lastSet=en.sets[en.sets.length-1];
    en.sets.push({w:lastSet?lastSet.w:0,r:lastSet?lastSet.r:0,done:false});save();render();
  },
  removeSet(exId){
    const en=S.active.entries.find(e=>e.exId===exId);
    if(en.sets.length>1){en.sets.pop();save();render();}
  },
  setVal(exId,i,k,v){
    const en=S.active.entries.find(e=>e.exId===exId);
    en.sets[i][k]=Math.max(0,parseFloat(v)||0);save();
  },
  bump(exId,i,k,dir){
    const en=S.active.entries.find(e=>e.exId===exId);
    const step=k==="w"?(S.settings.step||5):1;
    en.sets[i][k]=Math.max(0,(parseFloat(en.sets[i][k])||0)+dir*step);
    save();render();
  },
  toggleDone(exId,i){
    const en=S.active.entries.find(e=>e.exId===exId);
    const s=en.sets[i];
    s.done=!s.done;
    save();render();
    if(s.done&&s.r>0&&S.active.date===todayStr())Timer.start(S.settings.restSec||90);
  },
  setNotes(v){S.active.notes=v;save();},
  finish(){
    const kept=S.active.entries.map(en=>({exId:en.exId,sets:en.sets.filter(s=>s.done&&s.r>0)}))
      .filter(en=>en.sets.length);
    if(!kept.length){alert("No completed sets yet — check off sets with ✓ as you finish them.");return;}
    if(!confirm("Finish and save this workout?"))return;
    // set-count change prompt: never silently modify the program
    const day=S.active.dayId&&activeProg()?activeProg().days.find(d=>d.id===S.active.dayId):null;
    if(day){
      for(const en of kept){
        const it=day.items.find(x=>x.exId===en.exId);
        if(it&&it.sets!==en.sets.length){
          const ex=exById(en.exId);
          if(confirm(`You logged ${en.sets.length} set${en.sets.length===1?"":"s"} for ${ex?ex.name:"this exercise"} (program says ${it.sets}).\n\nKeep ${en.sets.length} sets permanently?\n\nOK = update program · Cancel = one-off`))
            it.sets=en.sets.length;
        }
      }
    }
    // PR detection against all prior history (before this save)
    let prs=[];
    for(const en of kept){
      const best=Math.max(...en.sets.map(s=>e1rm(s.w,s.r)));
      if(S.sessions.length>0&&best>bestE1rmFor(en.exId)){const ex=exById(en.exId);if(ex)prs.push(ex.name);}
    }
    // same-date merge
    const notes=(S.active.notes||"").trim();
    const existing=S.sessions.find(x=>x.date===S.active.date);
    if(existing){
      for(const en of kept){
        const tgt=existing.entries.find(e=>e.exId===en.exId);
        if(tgt)tgt.sets=tgt.sets.concat(en.sets);
        else existing.entries.push(en);
      }
      if(!existing.dayId&&S.active.dayId)existing.dayId=S.active.dayId;
      if(notes)existing.notes=existing.notes?existing.notes+"\n"+notes:notes;
    }else{
      S.sessions.push({id:S.active.id,date:S.active.date,dayId:S.active.dayId||null,notes,entries:kept});
    }
    sortSessions();
    S.active=null;Timer.stop();save();render();
    if(prs.length)alert("New estimated-1RM PR: "+prs.join(", ")+" 🟢");
  },
  discard(){
    if(confirm("Discard this session? Nothing will be saved."))
      {S.active=null;Timer.stop();save();render();}
  }
};

      ${this.showArchived?"Hide":"Show"} archived</button>
    <div class="card" style="margin-top:12px">
      <h3 style="font-size:14px;margin-bottom:10px">Data & settings</h3>
      <div class="field"><label>Rest timer (seconds)</label>
        <input type="number" inputmode="numeric" value="${S.settings.restSec}" onchange="S.settings.restSec=Math.max(10,parseInt(this.value)||90);save()"></div>
      <div class="field"><label>Weight step (lb)</label>
        <input type="number" inputmode="decimal" value="${S.settings.step}" onchange="S.settings.step=Math.max(.5,parseFloat(this.value)||5);save()"></div>
      <button class="btn block" onclick="Data.exportJson()">Export backup (JSON)</button>
      <button class="btn block" style="margin-top:8px" onclick="Data.importJson()">Import backup</button>
    </div><div style="height:20px"></div>`;
    return out;
  },
  edit(id,fromWorkout){
    const ex=id?exById(id):null;
    const n=ex?sessionCountFor(ex.id):0;
    Modal.open(`<h2>${ex?"Edit exercise":"New exercise"}</h2>
      <div class="field"><label>Name</label><input id="exName" value="${ex?esc(ex.name):""}" placeholder="e.g. Incline DB Press"></div>
      <div class="field"><label>Group</label>
        <select id="exGroup">
          ${["Push","Pull","Legs","Other"].map(g=>`<option ${ex&&ex.group===g?"selected":""}>${g}</option>`).join("")}
        </select></div>
      <button class="btn primary block" onclick="Library.save('${id||""}',${!!fromWorkout})">Save</button>
      ${ex?`<button class="btn block" style="margin-top:8px" onclick="Library.toggleArchive('${id}')">${ex.archived?"Restore":"Archive"} exercise</button>
      <button class="btn block danger" style="margin-top:8px" onclick="Library.remove('${id}')">Delete exercise${n?` (${n} logged session${n===1?"":"s"})`:""}</button>`:""}
      <button class="btn block subtle" style="margin-top:8px" onclick="Modal.close()">Cancel</button>`);
    setTimeout(()=>$("#exName").focus(),50);
  },
  save(id,fromWorkout){
    const name=$("#exName").value.trim();
    if(!name){alert("Give it a name.");return;}
    const group=$("#exGroup").value;
    if(id){const ex=exById(id);ex.name=name;ex.group=group;}
    else{
      const nx={id:uid(),name,group,archived:false};
      S.exercises.push(nx);
      if(fromWorkout&&S.active)S.active.entries.push({exId:nx.id,target:"",sets:[{w:0,r:0,done:false},{w:0,r:0,done:false},{w:0,r:0,done:false}]});
    }
    save();Modal.close();render();
  },
  toggleArchive(id){const ex=exById(id);ex.archived=!ex.archived;save();Modal.close();render();},
  remove(id){
    const ex=exById(id);
    const n=sessionCountFor(id);
    if(n>0){
      if(!confirm(`"${ex.name}" has ${n} logged session${n===1?"":"s"}. Delete anyway and remove that history?\n\n(Cancel to keep it — you can archive instead.)`))return;
    }
    // strip from history
    for(const sess of S.sessions)sess.entries=sess.entries.filter(e=>e.exId!==id);
    S.sessions=S.sessions.filter(s=>s.entries.length);
    // strip from programs
    for(const p of S.programs)for(const d of p.days)d.items=d.items.filter(it=>it.exId!==id);
    // strip from active session
    if(S.active)S.active.entries=S.active.entries.filter(e=>e.exId!==id);
    S.exercises=S.exercises.filter(e=>e.id!==id);
    save();Modal.close();render();
  }
};

/* ---------- program editor ---------- */
const Programs={
  create(){
    const p={id:uid(),name:"New Program",days:[]};
    S.programs.push(p);
    if(!S.activeProgram)S.activeProgram=p.id;
    save();this.edit(p.id);
  },
  setActive(id){S.activeProgram=id;save();render();},
  edit(progId){
    const p=progById(progId);
    if(!p)return;
    let days="";
    for(const d of p.days){
      days+=`<div class="prog-day">
        <div class="grow" onclick="Programs.editDay('${progId}','${d.id}')">
          <div style="font-weight:700">${esc(d.name)}</div>
          <div class="small muted">${d.items.length} exercise${d.items.length===1?"":"s"}</div></div>
        <button class="tag" onclick="Programs.editDay('${progId}','${d.id}')">Edit</button>
        <button class="mini del" onclick="Programs.delDay('${progId}','${d.id}')">✕</button>
      </div>`;
    }
    Modal.open(`<h2>Edit program</h2>
      <div class="field"><label>Program name</label>
        <input id="progName" value="${esc(p.name)}" onchange="Programs.rename('${progId}',this.value)"></div>
      <div class="field"><label>Days — tap to edit</label>
        ${days||'<div class="empty">No days yet.</div>'}</div>
      <button class="btn block" onclick="Programs.addDay('${progId}')">+ Add day</button>
      ${p.id!==S.activeProgram?`<button class="btn block" style="margin-top:8px" onclick="Programs.setActive('${progId}');Programs.edit('${progId}')">Set as active program</button>`:""}
      <button class="btn block" style="margin-top:8px" onclick="Programs.duplicate('${progId}')">Duplicate program</button>
      <button class="btn block danger" style="margin-top:8px" onclick="Programs.remove('${progId}')">Delete program</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="Modal.close();render()">Done</button>`);
  },
  rename(progId,v){const p=progById(progId);if(v.trim())p.name=v.trim();save();},
  addDay(progId){
    const p=progById(progId);
    const d={id:uid(),name:"Day "+(p.days.length+1),items:[]};
    p.days.push(d);save();this.editDay(progId,d.id);
  },
  delDay(progId,dayId){
    const p=progById(progId);
    const d=p.days.find(x=>x.id===dayId);
    if(!confirm(`Delete "${d.name}" from this program? Logged history is not affected.`))return;
    p.days=p.days.filter(x=>x.id!==dayId);save();this.edit(progId);
  },
  duplicate(progId){
    const p=progById(progId);
    const copy=JSON.parse(JSON.stringify(p));
    copy.id=uid();copy.name=p.name+" (copy)";
    copy.days.forEach(d=>{d.id=uid();});
    S.programs.push(copy);save();this.edit(copy.id);
  },
  remove(progId){
    const p=progById(progId);
    if(!confirm(`Delete program "${p.name}"? Days and presets are removed; your logged history is not affected.`))return;
    S.programs=S.programs.filter(x=>x.id!==progId);
    if(S.activeProgram===progId)S.activeProgram=S.programs.length?S.programs[0].id:null;
    save();Modal.close();render();
  },
  editDay(progId,dayId){
    const p=progById(progId);
    const d=p.days.find(x=>x.id===dayId);
    if(!d)return;
    let items="";
    d.items.forEach((it,i)=>{
      const ex=exById(it.exId);
      items+=`<div class="itemline">
        <div class="nm">${esc(ex?ex.name:"?")}</div>
        <div class="ctrls">
          <button class="mini" onclick="Programs.bumpSets('${progId}','${dayId}',${i},-1)">−</button>
          <div class="setsnum">${it.sets}</div>
          <button class="mini" onclick="Programs.bumpSets('${progId}','${dayId}',${i},1)">+</button>
          <input class="targetinp" value="${esc(it.target||"")}" placeholder="reps"
            onchange="Programs.setTarget('${progId}','${dayId}',${i},this.value)">
          <div class="sp"></div>
          <button class="mini" ${i===0?"disabled style='opacity:.3'":""} onclick="Programs.move('${progId}','${dayId}',${i},-1)">↑</button>
          <button class="mini" ${i===d.items.length-1?"disabled style='opacity:.3'":""} onclick="Programs.move('${progId}','${dayId}',${i},1)">↓</button>
          <button class="mini del" onclick="Programs.removeItem('${progId}','${dayId}',${i})">✕</button>
        </div>
      </div>`;
    });
    Modal.open(`<h2>Edit day</h2>
      <div class="field"><label>Day name</label>
        <input id="dayName" value="${esc(d.name)}" onchange="Programs.renameDay('${progId}','${dayId}',this.value)"></div>
      <div class="field"><label>Exercises — sets · rep target · order</label>
        ${items||'<div class="empty">No exercises yet.</div>'}</div>
      <button class="btn block" onclick="Programs.addItem('${progId}','${dayId}')">+ Add exercise</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="Programs.edit('${progId}')">← Back to program</button>`);
  },
  renameDay(progId,dayId,v){
    const d=progById(progId).days.find(x=>x.id===dayId);
    if(v.trim())d.name=v.trim();save();
  },
  bumpSets(progId,dayId,i,dir){
    const d=progById(progId).days.find(x=>x.id===dayId);
    d.items[i].sets=Math.min(10,Math.max(1,d.items[i].sets+dir));
    save();this.editDay(progId,dayId);
  },
  setTarget(progId,dayId,i,v){
    const d=progById(progId).days.find(x=>x.id===dayId);
    d.items[i].target=v.trim();save();
  },
  move(progId,dayId,i,dir){
    const d=progById(progId).days.find(x=>x.id===dayId);
    const j=i+dir;
    if(j<0||j>=d.items.length)return;
    [d.items[i],d.items[j]]=[d.items[j],d.items[i]];
    save();this.editDay(progId,dayId);
  },
  removeItem(progId,dayId,i){
    const d=progById(progId).days.find(x=>x.id===dayId);
    d.items.splice(i,1);save();this.editDay(progId,dayId);
  },
  addItem(progId,dayId){
    const d=progById(progId).days.find(x=>x.id===dayId);
    const groups=["Push","Pull","Legs","Other"];
    const avail=S.exercises.filter(e=>!e.archived&&!d.items.some(it=>it.exId===e.id));
    let list="";
    for(const g of groups){
      const ex=avail.filter(e=>e.group===g);
      if(!ex.length)continue;
      list+=`<div class="muted small" style="margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">${g}</div>`;
      for(const e of ex)
        list+=`<div class="lib-item" onclick="Programs.pickItem('${progId}','${dayId}','${e.id}')">
          <div class="grow"><div class="nm">${esc(e.name)}</div></div>
          <span class="tag">Add</span></div>`;
    }
    Modal.open(`<h2>Add exercise to day</h2>
      <div class="picklist">${list||'<div class="empty">All library exercises are already in this day.</div>'}</div>
      <button class="btn block subtle" style="margin-top:12px" onclick="Programs.editDay('${progId}','${dayId}')">← Back</button>`);
  },
  pickItem(progId,dayId,exId){
    const d=progById(progId).days.find(x=>x.id===dayId);
    d.items.push({exId,sets:3,target:""});
    save();this.editDay(progId,dayId);
  }
};

        <div class="seg">
          <button class="${this.mode==="w"?"on":""}" onclick="History.mode='w';render()">Weight</button>
          <button class="${this.mode==="r"?"on":""}" onclick="History.mode='r';render()">Reps</button>
        </div>
        <div class="seg">
          <button class="${this.count===5?"on":""}" onclick="History.count=5;render()">Last 5</button>
          <button class="${this.count===10?"on":""}" onclick="History.count=10;render()">Last 10</button>
          <button class="${this.count==="all"?"on":""}" onclick="History.count='all';render()">All</button>
        </div>
        <canvas id="spark" class="spark"></canvas>
        <div class="muted small" id="sparkCap" style="text-align:center;margin-top:4px"></div>
      </div>`;
    }
    if(!S.sessions.length)return out+`<div class="empty">No sessions yet. Your history shows up here after your first finished workout.</div>`;
    out+=`<div class="card"><h3 style="font-size:14px;margin-bottom:6px">Sessions</h3>`;
    for(let i=S.sessions.length-1;i>=0;i--){
      const s=S.sessions[i];
      let dayName="";
      if(s.dayId)for(const p of S.programs){const d=p.days.find(x=>x.id===s.dayId);if(d){dayName=d.name;break;}}
      out+=`<div class="sess"><div class="row">
        <div class="d grow">${fmtDate(s.date)}${dayName?` <span class="tag green" style="margin-left:6px">${esc(dayName)}</span>`:""}</div>
        <button class="tag" onclick="History.editSession('${s.id}')">Edit</button>
        <button class="tag" onclick="History.del('${s.id}')">Delete</button></div>`;
      for(const en of s.entries){
        const ex=exById(en.exId);
        out+=`<div class="ln">${esc(ex?ex.name:"?")}: ${en.sets.map(x=>x.w+"×"+x.r).join(", ")}</div>`;
      }
      if(s.notes)out+=`<div class="ln" style="font-style:italic;white-space:pre-wrap">📝 ${esc(s.notes)}</div>`;
      out+=`</div>`;
    }
    out+=`</div><div style="height:20px"></div>`;
    return out;
  },
  /* --- edit past session --- */
  editSession(id){
    const s=S.sessions.find(x=>x.id===id);
    if(!s)return;
    this.editBuf=JSON.parse(JSON.stringify(s));
    this.renderEditor();
  },
  renderEditor(){
    const b=this.editBuf;
    let body="";
    b.entries.forEach((en,ei)=>{
      const ex=exById(en.exId);
      let rows="";
      en.sets.forEach((st,si)=>{
        rows+=`<div class="setline">
          <div class="n">${si+1}</div>
          <input type="number" inputmode="decimal" value="${st.w}"
            onchange="History.eSet(${ei},${si},'w',this.value)">
          <input type="number" inputmode="numeric" value="${st.r}"
            onchange="History.eSet(${ei},${si},'r',this.value)">
          <button class="mini del" onclick="History.eDelSet(${ei},${si})">✕</button>
        </div>`;
      });
      body+=`<div class="field"><label>${esc(ex?ex.name:"?")}</label>
        <div class="collabel"><span></span><span>Weight</span><span>Reps</span><span></span></div>${rows}</div>`;
    });
    Modal.open(`<h2>Edit session — ${fmtDate(b.date)}</h2>
      ${body||'<div class="empty">No entries.</div>'}
      <div class="field"><label>Session notes</label>
        <textarea rows="3" onchange="History.editBuf.notes=this.value">${esc(b.notes||"")}</textarea></div>
      <button class="btn primary block" onclick="History.eSave()">Save changes</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="History.editBuf=null;Modal.close()">Cancel</button>`);
  },
  eSet(ei,si,k,v){this.editBuf.entries[ei].sets[si][k]=Math.max(0,parseFloat(v)||0);},
  eDelSet(ei,si){
    this.editBuf.entries[ei].sets.splice(si,1);
    if(!this.editBuf.entries[ei].sets.length)this.editBuf.entries.splice(ei,1);
    this.renderEditor();
  },
  eSave(){
    if(!confirm("Save changes to this session? This overwrites the logged data."))return;
    const b=this.editBuf;
    b.notes=(b.notes||"").trim();
    const i=S.sessions.findIndex(x=>x.id===b.id);
    if(i<0){alert("Session no longer exists.");this.editBuf=null;Modal.close();render();return;}
    if(!b.entries.length){
      if(!confirm("All sets were removed — delete this session entirely?"))return;
      S.sessions.splice(i,1);
    }else S.sessions[i]=b;
    this.editBuf=null;save();Modal.close();render();
  },
  logPast(){
    if(S.active){alert("Finish or discard your current session first — then you can backfill old workouts.");return;}
    const p=activeProg();
    let dayOpts="";
    if(p&&p.days.length)
      dayOpts=`<div class="field"><label>Program day (optional)</label>
        <select id="pastDay"><option value="">— None / freestyle —</option>
        ${p.days.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div>`;
    Modal.open(`<h2>Log a past workout</h2>
      <p class="muted small" style="margin:-8px 0 12px">Pick the date, then log it exactly like a live workout. It'll slot into your history in the right order.</p>
      <div class="field"><label>Workout date</label>
        <input type="date" id="pastDate" value="${todayStr()}" max="${todayStr()}"></div>
      ${dayOpts}
      <button class="btn primary block" onclick="History.startPast()">Start logging</button>
      <button class="btn block subtle" style="margin-top:8px" onclick="Modal.close()">Cancel</button>`);
  },
  startPast(){
    const d=$("#pastDate").value||todayStr();
    const daySel=$("#pastDay");
    const dayId=daySel?daySel.value:"";
    Modal.close();
    if(dayId)Workout.startDay(dayId,d);
    else Workout.startNew(d);
    go("workout");
  },
  del(id){
    if(!confirm("Delete this session permanently?"))return;
    S.sessions=S.sessions.filter(s=>s.id!==id);save();render();
  },
  /* Weight = heaviest weight that session; Reps = reps at that top weight */
  metricValue(en){
    const topW=Math.max(...en.sets.map(s=>s.w));
    if(this.mode==="w")return topW;
    return Math.max(...en.sets.filter(s=>s.w===topW).map(s=>s.r));
  },
  drawChart(){
    const c=document.getElementById("spark");
    if(!c||!this.selEx)return;
    let pts=[];
    for(const sess of S.sessions){
      const en=sess.entries.find(e=>e.exId===this.selEx);
      if(!en||!en.sets.length)continue;
      const v=this.metricValue(en);
      if(v>0)pts.push({d:sess.date,v});
    }
    if(this.count!=="all")pts=pts.slice(-this.count);
    const cap=document.getElementById("sparkCap");
    if(pts.length<1){cap.textContent="No data yet.";return;}
    const names={"w":"Top weight","r":"Reps at top weight"};
    const unit=this.mode==="w"?" lb":"";
    cap.textContent=`${names[this.mode]} · last ${pts.length} session${pts.length===1?"":"s"} · latest ${pts[pts.length-1].v.toLocaleString()}${unit}`;
    drawLine(c,pts,{labels:pts.length<=5?"all":"ends"});
  }
};

/* ---------- weight tab ---------- */
const Weight={
  html(){
    const w=S.weights;
    const latest=w.length?w[w.length-1]:null;
    const prev=w.length>1?w[w.length-2]:null;
    let delta="";
    if(latest&&prev){
      const d=latest.lb-prev.lb;
      delta=`<span class="wt-delta ${d>0?"up":d<0?"down":""}">${d>0?"+":""}${d.toFixed(1)} lb vs ${fmtDate(prev.date)}</span>`;
    }
    let out=`<div class="card">
      ${latest?`<div class="wt-big">${latest.lb.toFixed(1)} <span class="muted" style="font-size:16px;font-weight:700">lb · ${fmtDate(latest.date)}</span></div>${delta}`:
        `<p class="muted small">No weigh-ins yet. Log your first below.</p>`}
    </div>
    <div class="card">
      <div class="row">
        <div class="grow"><div class="field" style="margin-bottom:0"><label>Date</label>
          <input type="date" id="wDate" value="${todayStr()}" max="${todayStr()}"></div></div>
        <div style="width:110px"><div class="field" style="margin-bottom:0"><label>Weight (lb)</label>
          <input type="number" inputmode="decimal" id="wLb" placeholder="${latest?latest.lb:"lb"}"></div></div>
      </div>
      <button class="btn primary block" style="margin-top:12px" onclick="Weight.add()">Log weigh-in</button>
    </div>`;
    if(w.length){
      out+=`<div class="card">
        <canvas id="wspark" class="spark"></canvas>
        <div class="muted small" id="wsparkCap" style="text-align:center;margin-top:4px"></div>
      </div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:6px">Weigh-ins</h3>`;
      for(let i=w.length-1;i>=0;i--){
        const e=w[i];
        const p2=i>0?w[i-1]:null;
        const d2=p2?e.lb-p2.lb:null;
        out+=`<div class="wt-row">
          <div class="grow">${fmtDate(e.date)}</div>
          <b>${e.lb.toFixed(1)}</b>
          <span class="small ${d2===null?"muted":d2>0?"wt-delta up":d2<0?"wt-delta down":"muted"}" style="min-width:52px;text-align:right">
            ${d2===null?"—":(d2>0?"+":"")+d2.toFixed(1)}</span>
          <button class="tag" onclick="Weight.del('${e.date}')">✕</button>
        </div>`;
      }
      out+=`</div>`;
    }
    out+=`<div style="height:20px"></div>`;
    return out;
  },
  add(){
    const date=$("#wDate").value||todayStr();
    const lb=parseFloat($("#wLb").value);
    if(!lb||lb<=0){alert("Enter your weight.");return;}
    const existing=S.weights.find(w=>w.date===date);
    if(existing)existing.lb=lb;
    else S.weights.push({date,lb});
    S.weights.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    save();render();
  },
  del(date){
    if(!confirm("Delete this weigh-in?"))return;
    S.weights=S.weights.filter(w=>w.date!==date);save();render();
  },
  drawChart(){
    const c=document.getElementById("wspark");
    if(!c||!S.weights.length)return;
    const pts=S.weights.map(w=>({d:w.date,v:w.lb}));
    const cap=document.getElementById("wsparkCap");
    const first=pts[0].v,last=pts[pts.length-1].v,net=last-first;
    cap.textContent=`${pts.length} weigh-in${pts.length===1?"":"s"} · net ${net>0?"+":""}${net.toFixed(1)} lb since ${fmtDate(pts[0].d)}`;
    drawLine(c,pts);
  }
};

/* shared canvas line chart. opts.labels: "all" | "ends" | "none" (default) */
function drawLine(c,pts,opts){
  const labels=(opts&&opts.labels)||"none";
  const dpr=window.devicePixelRatio||1;
  const W=c.clientWidth*dpr,H=c.clientHeight*dpr;
  c.width=W;c.height=H;
  const ctx=c.getContext("2d");
  const padX=(labels==="none"?14:20)*dpr;
  const padTop=(labels==="none"?14:26)*dpr;
  const padBot=14*dpr;
  const vs=pts.map(p=>p.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi===lo){lo-=5;hi+=5;}
  const X=i=>pts.length===1?W/2:padX+(W-2*padX)*i/(pts.length-1);
  const Y=v=>H-padBot-(H-padTop-padBot)*(v-lo)/(hi-lo);
  ctx.strokeStyle="#0bda6e";ctx.lineWidth=2.5*dpr;ctx.lineJoin="round";
  ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(X(i),Y(p.v)):ctx.moveTo(X(0),Y(p.v));});
  ctx.stroke();
  ctx.fillStyle="#0bda6e";
  pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(X(i),Y(p.v),3.5*dpr,0,7);ctx.fill();});
  if(labels==="none")return;
  ctx.fillStyle="#eef1f3";
  ctx.font=`700 ${11*dpr}px system-ui,sans-serif`;
  ctx.textBaseline="bottom";
  pts.forEach((p,i)=>{
    if(labels==="ends"&&i!==0&&i!==pts.length-1)return;
    const t=p.v%1?p.v.toFixed(1):String(p.v);
    ctx.textAlign=i===0?"left":i===pts.length-1?"right":"center";
    const tx=i===0?Math.max(2*dpr,X(i)-8*dpr):i===pts.length-1?Math.min(W-2*dpr,X(i)+8*dpr):X(i);
    ctx.fillText(t,tx,Y(p.v)-6*dpr);
  });
}

/* ---------- data export/import ---------- */
const Data={
  exportJson(){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="liftlog-backup-"+todayStr()+".json";
    a.click();URL.revokeObjectURL(a.href);
  },
  importJson(){
    const inp=document.createElement("input");
    inp.type="file";inp.accept="application/json";
    inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const obj=JSON.parse(r.result);
          if(!obj.exercises||!obj.sessions)throw 0;
          if(confirm("Replace current data with this backup?")){S=migrate(obj);sortSessions();save();render();}
        }catch(e){alert("That file doesn't look like a Lift Log backup.");}
      };
      r.readAsText(f);
    };
    inp.click();
  }
};

      `<div class="modal" onclick="if(event.target===this)Modal.close()"><div class="sheet">${html}</div></div>`;
  },
  close(){document.getElementById("modalRoot").innerHTML="";}
};
